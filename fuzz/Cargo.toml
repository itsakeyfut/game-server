# cargo-fuzz project — a SEPARATE, nightly-only workspace, isolated from the
# stable workspace (the trailing `[workspace]` detaches it so the root's
# `cargo build`/clippy/test/deny never touch it). Run with `cargo fuzz run <target>`
# (needs a nightly toolchain + libFuzzer; Linux/macOS only).
[package]
name = "gsf-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
bytes = "1.12.1"
gsf-codec = { path = "../foundation/codec" }

# Codec / packet-parsing target — feeds arbitrary bytes to `gsf-codec` framing and
# asserts it never panics on malformed / truncated / oversized input.
[[bin]]
name = "codec_parse"
path = "fuzz_targets/codec_parse.rs"
test = false
doc = false
bench = false

[workspace]
