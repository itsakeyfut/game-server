[workspace]
resolver = "3"
members = [
    # foundation/ — generic networked-server toolkit (game-agnostic)
    "foundation/transport",
    "foundation/codec",
    "foundation/macros",
    "foundation/session",
    "foundation/middleware",
    "foundation/actor-runtime",
    "foundation/security",
    "foundation/observability",
    "foundation/net-sim",
    "foundation/lifecycle",
    # game/ — Game Server Framework
    "game/app",
    "game/room",
    "game/services",
    "game/turnbased",
    "game/realtime",
    "game/deterministic",
    "game/mmo",
    "game/runtime",
    "game/server",
    "game/client",
    # cache/ — Cache Server (shares foundation only)
    "cache/store",
    "cache/server",
    "cache/protocol",
    "cache/client",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
# MSRV — rolling N-2 (latest stable minus two). CI reads this value directly.
rust-version = "1.95"
license = "MIT OR Apache-2.0"

# External crate versions are centralized here; member crates opt in with
# `<dep> = { workspace = true }` as they gain real code.
[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
postcard = "1.1.3"
bytes = "1.12.1"
thiserror = "2.0.19"
futures = "0.3.33"
async-trait = "0.1.91"
# transport backends (WebSocket / TLS) — ring provider (no aws-lc-rs; Windows-safe)
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "logging", "std", "tls12"] }
# macros toolkit
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full"] }
# dev
proptest = "1.11.0"
rcgen = "0.14.8"
