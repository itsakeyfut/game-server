name: Fuzz

# cargo-fuzz smoke for codec / packet parsing. Deserialization must never panic
# on malformed input (operability §3.1/§3.2). Runs a short bounded smoke on PRs
# and pushes to main, plus a longer weekly sweep. cargo-fuzz needs nightly +
# libFuzzer (Linux).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      # `rust-toolchain.toml` pins `stable`; force nightly for cargo-fuzz's nested
      # builds via the env var (highest-precedence override for all cargo calls).
      # `--target` is explicit: the prebuilt cargo-fuzz (install-action) is
      # musl-static and otherwise defaults --target to musl, which lacks std here
      # and conflicts with the sanitizer's dynamically linked libc.
      - name: Fuzz smoke (codec_parse)
        env:
          RUSTUP_TOOLCHAIN: nightly
        run: cargo fuzz run codec_parse --target x86_64-unknown-linux-gnu -- -runs=50000 -max_total_time=30
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
